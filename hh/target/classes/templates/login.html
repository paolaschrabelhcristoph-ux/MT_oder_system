<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>用户登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at 10% 20%, rgba(255, 200, 200, 0.3) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(255, 220, 200, 0.3) 0%, transparent 20%),
                linear-gradient(135deg, #f9f0f0 0%, #f0e6e6 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            min-height: 100vh;
            position: relative;
        }

        .title {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: #8B4513;
            font-size: 48px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
            font-family: 'Microsoft YaHei', sans-serif;
            z-index: 5;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.85);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(139, 69, 19, 0.2);
            width: 320px;
            z-index: 10;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            position: relative;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #5a3e36;
            font-weight: 500;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #d9c2b3;
            border-radius: 6px;
            box-sizing: border-box;
            background-color: rgba(255, 255, 255, 0.8);
            transition: border-color 0.3s ease;
            font-size: 14px;
        }

        input[type="text"]:focus, input[type="password"]:focus {
            outline: none;
            border-color: #d4a083;
            box-shadow: 0 0 0 2px rgba(212, 160, 131, 0.2);
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #d4a083 0%, #b87333 100%);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        button:hover {
            background: linear-gradient(135deg, #c18f6d 0%, #a5642d 100%);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(184, 115, 51, 0.3);
        }

        .error {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 5px;
            text-align: center;
            padding: 8px;
            background-color: rgba(231, 76, 60, 0.1);
            border-radius: 4px;
        }

        .link {
            text-align: center;
            margin-top: 18px;
        }

        .link a {
            color: #d4a083;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .link a:hover {
            color: #b87333;
            text-decoration: underline;
        }

        h2 {
            text-align: center;
            color: #8B4513;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
<div class="title">奶茶点单系统</div>
<div class="container">
    <h2>用户登录</h2>
    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username">用户名:</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div class="form-group">
            <label for="password">密码:</label>
            <input type="password" id="password" name="password" required>
        </div>
        <div th:if="${error}" class="error">
            <span th:text="${error}"></span>
        </div>
        <button type="submit">登录</button>
    </form>
    <div class="link">
        <a th:href="@{/register}">还没有账号？立即注册</a>
    </div>
    <div th:if="${error}" class="error">
        <span th:text="${error}"></span>
    </div>

</div>
</body>
</html>
