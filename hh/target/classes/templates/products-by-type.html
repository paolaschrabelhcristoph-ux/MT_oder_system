<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>按类型筛选商品</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background:
                radial-gradient(circle at 10% 20%, rgba(255, 200, 200, 0.3) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(255, 220, 200, 0.3) 0%, transparent 20%),
                linear-gradient(135deg, #f9f0f0 0%, #f0e6e6 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #8B4513;
            font-size: 36px;
            margin-bottom: 10px;
        }

        .current-type {
            text-align: center;
            font-size: 20px;
            color: #8B4513;
            margin-bottom: 20px;
        }

        .back-to-all {
            display: block;
            text-align: center;
            margin-bottom: 20px;
        }

        .back-to-all a {
            color: #d4a083;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
        }

        .back-to-all a:hover {
            text-decoration: underline;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(139, 69, 19, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: transform 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-image {
            width: 100%;
            height: 180px;
            background-color: #f0e6e6;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8B4513;
            font-size: 24px;
            overflow: hidden;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-name {
            font-size: 20px;
            margin-bottom: 10px;
            color: #8B4513;
            font-weight: bold;
        }

        .product-description {
            color: #666;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .product-types {
            margin-bottom: 15px;
        }

        .type-tag {
            display: inline-block;
            padding: 4px 10px;
            background: rgba(212, 160, 131, 0.2);
            color: #8B4513;
            border-radius: 12px;
            font-size: 12px;
            margin: 2px;
        }

        .product-price {
            font-size: 22px;
            font-weight: bold;
            color: #e74c3c;
            margin-bottom: 15px;
        }

        .add-to-cart {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #d4a083 0%, #b87333 100%);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .add-to-cart:hover {
            background: linear-gradient(135deg, #c18f6d 0%, #a5642d 100%);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>奶茶产品列表</h1>
        <div class="current-type" th:text="'分类：' + ${typeName}"></div>
        <div class="back-to-all">
            <a href="/products">返回全部商品</a>
        </div>
    </div>

    <div class="product-grid">
        <div class="product-card" th:each="product : ${products}">
            <div class="product-image">
                <img th:if="${product.imageUrl}" th:src="${product.imageUrl}" th:alt="${product.name}" onerror="this.style.display='none';this.parentElement.querySelector('.product-image-text').style.display='flex';">
                <div class="product-image-text" style="display:flex; align-items:center; justify-content:center; width:100%; height:100%; color:#8B4513; font-size:24px;" th:text="${#strings.substring(product.name, 0, 1)}"></div>
            </div>
            <div class="product-name" th:text="${product.name}"></div>
            <div class="product-description" th:text="${product.description}"></div>
            <div class="product-types">
                <span class="type-tag" th:each="type : ${#lists.toList(productService.getProductTypes(product))}" th:text="${type.name}"></span>
            </div>
            <div class="product-price" th:text="'¥' + ${product.price}"></div>
            <button class="add-to-cart" th:attr="data-product-id=${product.id}">加入购物车</button>
        </div>
    </div>
</div>

<script>
    // 添加到购物车功能
    document.querySelectorAll('.add-to-cart').forEach(button => {
        button.addEventListener('click', function() {
            const productId = this.getAttribute('data-product-id');

            // 检查用户是否已登录
            fetch('/api/profile')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        // 已登录，执行添加到购物车操作
                        fetch('/api/cart/add', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({productId: parseInt(productId)})
                        })
                        .then(response => response.json())
                        .then(result => {
                            if (result.success) {
                                alert('商品已成功添加到购物车');
                            } else {
                                alert('添加购物车失败: ' + (result.message || '未知错误'));
                            }
                        })
                        .catch(error => {
                            alert('网络错误: ' + error.message);
                        });
                    } else {
                        // 未登录，跳转到登录页面
                        alert('请先登录');
                        window.location.href = '/login';
                    }
                })
                .catch(error => {
                    alert('网络错误: ' + error.message);
                });
        });
    });
</script>
</body>
</html>
